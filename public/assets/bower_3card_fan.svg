<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" width="100%" height="100%" fill="none">
  <defs>
    <!-- Card Drop Shadows -->
    <filter id="shadowLeft" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="shadowMid" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
    <filter id="shadowRight" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#fbbf24" flood-opacity="0.6" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="goldCardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="slateCardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="emeraldCardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#044e39" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="laurelGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <!-- Ambient Golden Backlight Glow -->
  <ellipse cx="170" cy="95" rx="100" ry="50" fill="url(#laurelGrad)" opacity="0.12" filter="blur(20px)" />

  <!-- =====================================================================
       LEFT LAUREL WREATH BRANCH
  ===================================================================== -->
  <g id="leftLaurel" stroke="url(#laurelGrad)" fill="url(#laurelGrad)" filter="url(#goldGlow)">
    <!-- Laurel Stem -->
    <path d="M125 165 C 80 155, 55 120, 58 75 C 60 55, 75 35, 95 24" fill="none" stroke-width="2.5" stroke-linecap="round" />
    <!-- Leaf Pairs along Stem -->
    <path d="M110 160 C 100 162, 95 158, 102 150 C 108 145, 114 152, 110 160 Z" />
    <path d="M118 153 C 114 145, 118 138, 126 142 C 130 148, 124 154, 118 153 Z" />

    <path d="M88 142 C 76 142, 73 135, 82 128 C 90 123, 94 133, 88 142 Z" />
    <path d="M98 133 C 94 124, 100 118, 108 122 C 113 128, 106 135, 98 133 Z" />

    <path d="M72 118 C 60 116, 58 108, 68 102 C 76 98, 80 108, 72 118 Z" />
    <path d="M82 108 C 80 98, 87 93, 95 98 C 99 104, 91 112, 82 108 Z" />

    <path d="M63 90 C 52 86, 52 77, 63 73 C 71 70, 74 80, 63 90 Z" />
    <path d="M74 80 C 74 70, 82 66, 89 72 C 92 78, 83 85, 74 80 Z" />

    <path d="M65 62 C 56 55, 58 46, 69 45 C 77 44, 78 54, 65 62 Z" />
    <path d="M77 53 C 79 43, 88 41, 93 48 C 95 55, 86 60, 77 53 Z" />

    <!-- Crown Tip Leaves -->
    <path d="M78 36 C 72 27, 78 18, 89 20 C 96 22, 93 32, 78 36 Z" />
    <path d="M95 24 C 98 14, 108 15, 111 23 C 112 30, 103 32, 95 24 Z" />
  </g>

  <!-- =====================================================================
       RIGHT LAUREL WREATH BRANCH
  ===================================================================== -->
  <g id="rightLaurel" stroke="url(#laurelGrad)" fill="url(#laurelGrad)" filter="url(#goldGlow)">
    <!-- Laurel Stem -->
    <path d="M215 165 C 260 155, 285 120, 282 75 C 280 55, 265 35, 245 24" fill="none" stroke-width="2.5" stroke-linecap="round" />
    <!-- Leaf Pairs along Stem -->
    <path d="M230 160 C 240 162, 245 158, 238 150 C 232 145, 226 152, 230 160 Z" />
    <path d="M222 153 C 226 145, 222 138, 214 142 C 210 148, 216 154, 222 153 Z" />

    <path d="M252 142 C 264 142, 267 135, 258 128 C 250 123, 246 133, 252 142 Z" />
    <path d="M242 133 C 246 124, 240 118, 232 122 C 227 128, 234 135, 242 133 Z" />

    <path d="M268 118 C 280 116, 282 108, 272 102 C 264 98, 260 108, 268 118 Z" />
    <path d="M258 108 C 260 98, 253 93, 245 98 C 241 104, 249 112, 258 108 Z" />

    <path d="M277 90 C 288 86, 288 77, 277 73 C 269 70, 266 80, 277 90 Z" />
    <path d="M266 80 C 266 70, 258 66, 251 72 C 248 78, 257 85, 266 80 Z" />

    <path d="M275 62 C 284 55, 282 46, 271 45 C 263 44, 262 54, 275 62 Z" />
    <path d="M263 53 C 261 43, 252 41, 247 48 C 245 55, 254 60, 263 53 Z" />

    <!-- Crown Tip Leaves -->
    <path d="M262 36 C 268 27, 262 18, 251 20 C 244 22, 247 32, 262 36 Z" />
    <path d="M245 24 C 242 14, 232 15, 229 23 C 228 30, 237 32, 245 24 Z" />
  </g>

  <!-- =====================================================================
       CARD 1 (LEFT): JACK OF SPADES (Left Bower / Sovereign Spade)
  ===================================================================== -->
  <g transform="translate(122, 102) rotate(-15)" filter="url(#shadowLeft)">
    <!-- Card Base & Gold Border -->
    <rect x="-37" y="-55" width="74" height="110" rx="8" fill="url(#slateCardFace)" stroke="url(#goldBorder)" stroke-width="2" />
    <!-- Inner Fine Inset Border -->
    <rect x="-33" y="-51" width="66" height="102" rx="5" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="0.8" />

    <!-- Top Left Index -->
    <text x="-28" y="-36" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13">J</text>
    <path d="M-24 -33 C -25.5 -31.5, -28 -29, -28 -27 A 2.2 2.2 0 0 0 -24 -25.5 L -24.5 -23.5 L -23.5 -23.5 L -24 -25.5 A 2.2 2.2 0 0 0 -20 -27 C -20 -29, -22.5 -31.5, -24 -33 Z" fill="#fbbf24" />

    <!-- Center Giant Spade Symbol -->
    <g transform="translate(0, 0) scale(1.6)">
      <path d="M0 -12 C -4 -6, -9 -1, -9 3.5 A 4.5 4.5 0 0 0 -3.5 8 C -2 8, -0.8 7.2, 0 6 C 0.8 7.2, 2 8, 3.5 8 A 4.5 4.5 0 0 0 9 3.5 C 9 -1, 4 -6, 0 -12 Z" fill="#fbbf24" />
      <path d="M-1.2 6 C -1.8 8.5, -3 11, -4.5 12.5 L 4.5 12.5 C 3 11, 1.8 8.5, 1.2 6 Z" fill="#fbbf24" />
    </g>

    <!-- Bottom Right Inverted Index -->
    <g transform="rotate(180)">
      <text x="-28" y="-36" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13">J</text>
      <path d="M-24 -33 C -25.5 -31.5, -28 -29, -28 -27 A 2.2 2.2 0 0 0 -24 -25.5 L -24.5 -23.5 L -23.5 -23.5 L -24 -25.5 A 2.2 2.2 0 0 0 -20 -27 C -20 -29, -22.5 -31.5, -24 -33 Z" fill="#fbbf24" />
    </g>
  </g>

  <!-- =====================================================================
       CARD 3 (RIGHT): EMERALD SOVEREIGN JACK OF CLUBS
  ===================================================================== -->
  <g transform="translate(218, 102) rotate(15)" filter="url(#shadowRight)">
    <!-- Card Base & Gold Border -->
    <rect x="-37" y="-55" width="74" height="110" rx="8" fill="url(#emeraldCardFace)" stroke="url(#goldBorder)" stroke-width="2" />
    <!-- Inner Fine Inset Border -->
    <rect x="-33" y="-51" width="66" height="102" rx="5" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="0.8" />

    <!-- Top Left Index -->
    <text x="-28" y="-36" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13">J</text>
    <g transform="translate(-24, -28) scale(0.65)" fill="#fbbf24">
      <circle cx="0" cy="-4" r="3.2" />
      <circle cx="-3.8" cy="1.5" r="3.2" />
      <circle cx="3.8" cy="1.5" r="3.2" />
      <circle cx="0" cy="0" r="2" />
      <path d="M-1 0 C -1.5 2, -2.5 5, -4 7 L 4 7 C 2.5 5, 1.5 2, 1 0 Z" />
    </g>

    <!-- Center Giant Emerald Trefoil Club Symbol -->
    <g transform="translate(0, 0) scale(1.6)" fill="#fbbf24">
      <circle cx="0" cy="-4.5" r="4.2" />
      <circle cx="-5" cy="2.2" r="4.2" />
      <circle cx="5" cy="2.2" r="4.2" />
      <circle cx="0" cy="0.5" r="2.8" />
      <path d="M-1.5 1 C -2 4, -3.5 8, -5.5 10.5 L 5.5 10.5 C 3.5 8, 2 4, 1.5 1 Z" />
    </g>

    <!-- Bottom Right Inverted Index -->
    <g transform="rotate(180)">
      <text x="-28" y="-36" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13">J</text>
      <g transform="translate(-24, -28) scale(0.65)" fill="#fbbf24">
        <circle cx="0" cy="-4" r="3.2" />
        <circle cx="-3.8" cy="1.5" r="3.2" />
        <circle cx="3.8" cy="1.5" r="3.2" />
        <circle cx="0" cy="0" r="2" />
        <path d="M-1 0 C -1.5 2, -2.5 5, -4 7 L 4 7 C 2.5 5, 1.5 2, 1 0 Z" />
      </g>
    </g>
  </g>

  <!-- =====================================================================
       CARD 2 (CENTER - ELEVATED): GOLDEN BOWER JACK OF CLUBS (Right Bower)
  ===================================================================== -->
  <g transform="translate(170, 88)" filter="url(#shadowMid)">
    <!-- Card Base & 24K Gold Border -->
    <rect x="-40" y="-60" width="80" height="120" rx="9" fill="url(#goldCardFace)" stroke="url(#goldBorder)" stroke-width="2.5" />
    
    <!-- Top RIGHT BOWER Ribbon -->
    <rect x="-37" y="-57" width="74" height="16" rx="4" fill="#0f172a" />
    <text x="0" y="-46" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8.5" text-anchor="middle" letter-spacing="1.2">RIGHT BOWER</text>

    <!-- Top Left Corner Index -->
    <text x="-30" y="-26" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15">J</text>
    <g transform="translate(-25, -17) scale(0.75)" fill="#0f172a">
      <circle cx="0" cy="-4" r="3.2" />
      <circle cx="-3.8" cy="1.5" r="3.2" />
      <circle cx="3.8" cy="1.5" r="3.2" />
      <circle cx="0" cy="0" r="2" />
      <path d="M-1 0 C -1.5 2, -2.5 5, -4 7 L 4 7 C 2.5 5, 1.5 2, 1 0 Z" />
    </g>

    <!-- Center Standard Casino Trefoil Club (Authentic, Crisp, Solid Jet Black) -->
    <g transform="translate(0, 8) scale(2.0)" fill="#0f172a">
      <circle cx="0" cy="-4.8" r="4.2" />
      <circle cx="-5.2" cy="2.2" r="4.2" />
      <circle cx="5.2" cy="2.2" r="4.2" />
      <circle cx="0" cy="0.6" r="2.8" />
      <path d="M-1.5 1 C -2.2 4, -3.8 8.2, -6 11 L 6 11 C 3.8 8.2, 2.2 4, 1.5 1 Z" />
    </g>

    <!-- Bottom Right Inverted Index -->
    <g transform="rotate(180)">
      <text x="-30" y="-26" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15">J</text>
      <g transform="translate(-25, -17) scale(0.75)" fill="#0f172a">
        <circle cx="0" cy="-4" r="3.2" />
        <circle cx="-3.8" cy="1.5" r="3.2" />
        <circle cx="3.8" cy="1.5" r="3.2" />
        <circle cx="0" cy="0" r="2" />
        <path d="M-1 0 C -1.5 2, -2.5 5, -4 7 L 4 7 C 2.5 5, 1.5 2, 1 0 Z" />
      </g>
    </g>
  </g>
</svg>
